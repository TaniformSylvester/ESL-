<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Sorter — TeachLuma Games</title>
<style>
  :root {
    --tlfx-accent: var(--subject-math);
    --brand-primary: #2563eb;
    --brand-secondary: #f59e0b;
    --brand-success: #16a34a;
    --brand-danger: #dc2626;
    --brand-bg-soft: #f8fafc;
    --subject-math: #7c3aed;
    --subject-math-dark: #5b21b6;
    --ink: #1f2937;
    --ink-soft: #64748b;
    --border: #e2e8f0;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--ink);
    background: var(--brand-bg-soft);
    overflow-x: hidden;
  }

  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #app:fullscreen,
  #app:-webkit-full-screen {
    background: var(--brand-bg-soft);
  }

  .hidden { display: none !important; }

  /* -----------------------------------------------------------------
     Top bar
     ----------------------------------------------------------------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 0.9rem;
    background: #fff;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .topbar-title {
    font-weight: 700;
    font-size: clamp(0.9rem, 2vw, 1.15rem);
    color: var(--subject-math-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    font-weight: 600;
    padding: 0.5rem 0.8rem;
    border-radius: 0.5rem;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    line-height: 1;
    min-height: 44px;
    touch-action: manipulation;
  }

  .icon-btn:hover { border-color: var(--subject-math); color: var(--subject-math); }
  .icon-btn:focus-visible { outline: 3px solid var(--subject-math); outline-offset: 2px; }

  .topbar-actions { display: flex; gap: 0.5rem; }

  /* -----------------------------------------------------------------
     Shared "screen" layout
     ----------------------------------------------------------------- */
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.25rem 1rem 2rem;
    width: 100%;
  }

  .screen-inner {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }

  /* -----------------------------------------------------------------
     Start screen
     ----------------------------------------------------------------- */
  .start-hero {
    text-align: center;
    margin-bottom: 1.75rem;
  }

  .start-hero h1 {
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    font-weight: 800;
    margin: 0 0 0.35rem;
    color: var(--subject-math-dark);
    letter-spacing: -0.01em;
  }

  .start-hero p {
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    color: var(--ink-soft);
    margin: 0;
    font-weight: 600;
  }

  .option-group {
    margin-bottom: 1.5rem;
  }

  .option-group-label {
    display: block;
    font-size: clamp(0.85rem, 1.8vw, 1rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 0.6rem;
  }

  .option-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
  }

  .option-btn {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    font-weight: 700;
    padding: 0.9rem 0.5rem;
    border-radius: 0.65rem;
    border: 2.5px solid var(--border);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    transition: border-color 0.12s ease, background-color 0.12s ease, color 0.12s ease;
  }

  .option-btn:hover { border-color: var(--subject-math); }
  .option-btn:focus-visible { outline: 3px solid var(--subject-math); outline-offset: 2px; }

  .option-btn[aria-pressed="true"] {
    background: var(--subject-math);
    border-color: var(--subject-math);
    color: #fff;
  }

  .option-btn-stacked { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; line-height: 1.15; }
  .option-btn-stacked .opt-sub { font-size: 0.7em; font-weight: 600; opacity: 0.8; }

  .start-btn {
    display: block;
    width: 100%;
    font-size: clamp(1.15rem, 3vw, 1.5rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 1.1rem 1rem;
    border-radius: 0.75rem;
    border: none;
    background: var(--subject-math);
    color: #fff;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    transition: background-color 0.12s ease, transform 0.08s ease;
  }

  .start-btn:hover { background: var(--subject-math-dark); }
  .start-btn:active { transform: scale(0.98); }
  .start-btn:focus-visible { outline: 3px solid var(--subject-math-dark); outline-offset: 3px; }

  /* -----------------------------------------------------------------
     Play screen — HUD
     ----------------------------------------------------------------- */
  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .hud-stat {
    font-size: clamp(0.95rem, 2vw, 1.2rem);
    font-weight: 700;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .hud-stat strong { color: var(--ink); }

  .hud-streak { color: var(--brand-secondary); }

  @keyframes streakPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .hud-streak.pop { animation: streakPop 0.4s ease; }

  .progress-track {
    width: 100%;
    height: 10px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 1.5rem;
  }

  .progress-fill {
    height: 100%;
    background: var(--subject-math);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .timer-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }

  .timer-track {
    flex: 1;
    height: 14px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }

  .timer-fill {
    height: 100%;
    background: var(--brand-secondary);
    border-radius: 999px;
    transition: width 1s linear;
  }

  .timer-fill.urgent { background: var(--brand-danger); }

  .timer-label {
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    font-weight: 800;
    color: var(--ink-soft);
    min-width: 2.2ch;
    text-align: right;
  }

  .game-display {
    display: flex;
    justify-content: center;
    margin: 0.25rem 0 1rem;
  }

  .ss-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    min-width: clamp(160px, 40vw, 230px);
    padding: 0.9rem 1.5rem 1rem;
    border-radius: 1.4rem;
    background: #fff;
    border: 3px solid var(--border);
    box-shadow: 0 6px 0 #EDE3D0;
  }

  .ss-emoji {
    font-size: clamp(3.6rem, 13vw, 5.6rem);
    line-height: 1.1;
  }

  .ss-name {
    font-size: clamp(1.3rem, 4vw, 1.9rem);
    font-weight: 800;
    color: var(--subject-math-dark);
  }

  .answers.answers-three {
    grid-template-columns: repeat(3, 1fr);
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
  }

  @media (max-width: 479.98px) {
    .answers.answers-three { grid-template-columns: 1fr; max-width: 320px; }
  }

  .fact {
    text-align: center;
    min-height: 1.4rem;
    margin: -0.5rem auto 0;
    max-width: 560px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .question {
    text-align: center;
    font-size: clamp(1.2rem, 3.5vw, 1.75rem);
    font-weight: 800;
    color: var(--ink);
    margin: 0.5rem 0 1.75rem;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }

  .answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.85rem;
    margin-bottom: 1.25rem;
  }

  @media (min-width: 640px) {
    .answers { grid-template-columns: repeat(4, 1fr); }
  }

  .answers.answers-compact {
    grid-template-columns: repeat(2, 1fr);
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }

  .answer-btn {
    /* Category labels ("⚙️ Non-living") must stay on one line. */
    font-size: clamp(1.1rem, 4.2vw, 1.5rem);
    white-space: nowrap;
    font-weight: 800;
    padding: 1rem 0.5rem;
    min-height: clamp(4.5rem, 14vw, 6.5rem);
    border-radius: 0.85rem;
    border: 3px solid var(--subject-math);
    background: #fff;
    color: var(--subject-math);
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.12s ease, color 0.12s ease, transform 0.08s ease;
  }

  .answer-btn:hover:not(:disabled) { background: var(--subject-math); color: #fff; }
  .answer-btn:active:not(:disabled) { transform: scale(0.97); }
  .answer-btn:focus-visible { outline: 3px solid var(--subject-math-dark); outline-offset: 3px; }
  .answer-btn:disabled { cursor: default; }

  .answer-btn.correct {
    background: var(--brand-success);
    border-color: var(--brand-success);
    color: #fff;
    opacity: 1;
  }

  .answer-btn.incorrect {
    background: var(--brand-danger);
    border-color: var(--brand-danger);
    color: #fff;
    opacity: 1;
  }

  .answer-btn.dimmed { opacity: 0.45; }

  .feedback {
    text-align: center;
    font-size: clamp(1.15rem, 3vw, 1.6rem);
    font-weight: 800;
    min-height: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .feedback.correct { color: var(--brand-success); }
  .feedback.incorrect { color: var(--brand-danger); }

  /* -----------------------------------------------------------------
     Results screen
     ----------------------------------------------------------------- */
  .results-emoji { font-size: clamp(3rem, 8vw, 4.5rem); margin-bottom: 0.5rem; }

  .results-score {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 800;
    color: var(--subject-math-dark);
    margin: 0 0 0.25rem;
  }

  .results-detail {
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    color: var(--ink-soft);
    font-weight: 600;
    margin: 0 0 1.75rem;
    text-align: center;
  }

  .results-actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  @media (min-width: 480px) {
    .results-actions { flex-direction: row; }
  }

  .btn-secondary {
    flex: 1;
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    font-weight: 700;
    padding: 0.9rem 1rem;
    border-radius: 0.75rem;
    border: 2.5px solid var(--subject-math);
    background: #fff;
    color: var(--subject-math);
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
  }

  .btn-secondary:hover { background: var(--brand-bg-soft); }
  .btn-secondary:focus-visible { outline: 3px solid var(--subject-math); outline-offset: 2px; }

  .btn-primary-lg {
    flex: 1;
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    font-weight: 700;
    padding: 0.9rem 1rem;
    border-radius: 0.75rem;
    border: none;
    background: var(--subject-math);
    color: #fff;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
  }

  .btn-primary-lg:hover { background: var(--subject-math-dark); }
  .btn-primary-lg:focus-visible { outline: 3px solid var(--subject-math-dark); outline-offset: 2px; }

  .center-text { text-align: center; }

  @media (max-height: 760px) and (min-height: 481px) {
    .screen { padding: 0.9rem 1rem 1.25rem; }
    .start-hero { margin-bottom: 1.1rem; }
    .option-group { margin-bottom: 1rem; }
    .option-btn { padding: 0.7rem 0.5rem; min-height: 48px; }
    .start-btn { padding: 0.85rem 1rem; min-height: 56px; }
  }

  @media (max-height: 760px) and (min-height: 481px) and (min-width: 700px) {
    .option-groups-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.2rem 1.5rem;
    }
    .option-group { margin-bottom: 0.85rem; }
  }

  @media (max-height: 480px) and (orientation: landscape) {
    .topbar { padding: 0.25rem 0.75rem; }
    .icon-btn { min-height: 32px; padding: 0.3rem 0.6rem; font-size: 0.8rem; }
    .screen { padding: 0.4rem 1rem; justify-content: flex-start; }

    .start-hero { margin-bottom: 0.4rem; }
    .start-hero h1 { font-size: clamp(1.1rem, 3vw, 1.6rem); margin-bottom: 0.1rem; }
    .start-hero p { font-size: clamp(0.7rem, 1.8vw, 0.85rem); }

    .option-groups-wrap {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }
    .option-group { flex: 1; margin-bottom: 0; }
    .option-group-label { font-size: 0.65rem; margin-bottom: 0.2rem; }
    .option-row { grid-template-columns: 1fr; gap: 0.25rem; }
    .option-btn { min-height: 30px; padding: 0.25rem; font-size: 0.75rem; border-width: 2px; }

    .start-btn { min-height: 38px; padding: 0.45rem 1rem; font-size: 1rem; }

    .hud { margin-bottom: 0.4rem; }
    .progress-track { margin-bottom: 0.5rem; }
    .timer-wrap { margin-bottom: 0.5rem; }
    .ss-card { padding: 0.3rem 1rem; }
    .ss-emoji { font-size: 2.4rem; }
    .ss-name { font-size: 1.05rem; }
    .fact { font-size: 0.8rem; margin-top: -0.3rem; }
    .question { margin: 0.15rem 0 0.5rem; font-size: clamp(1rem, 3.5vw, 1.4rem); }
    .answers { gap: 0.5rem; margin-bottom: 0.6rem; }
    .answer-btn { min-height: clamp(2.5rem, 10vw, 3.5rem); font-size: clamp(1rem, 3.5vw, 1.4rem); }
    .feedback { min-height: 1.6rem; font-size: 1.1rem; }

    .results-emoji { font-size: 2rem; margin-bottom: 0.25rem; }
    .results-score { font-size: 1.5rem; margin-bottom: 0.15rem; }
    .results-detail { margin-bottom: 0.75rem; }
  }

  @media (max-height: 480px) and (orientation: landscape) and (max-width: 560px) {
    .option-groups-wrap { flex-direction: column; gap: 0.2rem; }
    .option-group-label { margin-bottom: 0.1rem; }
    .option-row { grid-template-columns: repeat(3, 1fr); }
    .option-btn { min-height: 26px; padding: 0.15rem; }
  }

  @media (min-width: 1200px) {
    .screen-inner { max-width: 900px; }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>

<body>
<div id="app">
  <div class="topbar">
    <span class="topbar-title"><a class="topbar-home" href="../../../games.php" target="_top" aria-label="All TeachLuma games"><img src="../../brand/teachluma-icon.svg" alt="" width="32" height="30"></a><span class="topbar-name">Science Sorter</span></span>
    <div class="topbar-actions">

        <p>Grade 1&ndash;3 Science &middot; Living Things, Animal Groups &amp; Matter</p>

      <div class="option-groups-wrap">
        <div class="option-group" role="group" aria-labelledby="modeLabel">
          <span class="option-group-label" id="modeLabel">Choose your game</span>
          <div class="option-row" id="modeGroup">
            <button type="button" class="option-btn" data-value="living" aria-pressed="true">Living?</button>

          <span class="option-group-label" id="countLabel">Questions</span>
          <div class="option-row" id="countGroup">
            <button type="button" class="option-btn" data-value="10" aria-pressed="true">10</button>
            <button type="button" class="option-btn" data-value="15" aria-pressed="false">15</button>
            <button type="button" class="option-btn" data-value="20" aria-pressed="false">20</button>

          <span class="option-group-label" id="timerLabel">Timer per question</span>
          <div class="option-row" id="timerGroup">
            <button type="button" class="option-btn" data-value="0" aria-pressed="true">Off</button>
            <button type="button" class="option-btn" data-value="10">10 sec</button>
            <button type="button" class="option-btn" data-value="20">20 sec</button>
          </div>
        </div>
      </div>

      <div class="start-actions">
        <button type="button" class="start-btn" id="startBtn">▶ Start Game</button>
        <button type="button" class="start-btn start-btn-teams" id="startTeamsBtn" aria-label="Play in two teams">👥 2 Teams</button>
      </div>
    </div>
  </section>

  <!-- PLAY SCREEN -->
  <section class="screen hidden" id="screenPlay" aria-label="Science Sorter gameplay">
    <div class="screen-inner">
      <div class="hud">
        <span class="hud-stat" id="hudCounter" aria-live="polite">Question <strong>1</strong> / 10</span>
        <span class="hud-stat hidden" id="hudTeam" aria-live="polite"></span>
        <span class="hud-stat hud-streak hidden" id="hudStreak">🔥 <strong id="hudStreakCount">0</strong> streak</span>
        <span class="hud-stat">Score: <strong id="hudScore">0</strong></span>

      <div class="progress-track" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" id="progressTrack">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>

        <div class="timer-track" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="100" id="timerTrack">
          <div class="timer-fill" id="timerFill" style="width:100%"></div>
        </div>
        <span class="timer-label" id="timerLabelText">10</span>

      <div class="game-display" id="gameDisplay" aria-live="polite"></div>

      <div class="answers" id="answersGrid">

        <button type="button" class="answer-btn" data-index="1"></button>

      <p class="fact" id="factText" aria-live="polite"></p>
    </div>
  </section>

  <!-- RESULTS SCREEN -->
  <section class="screen hidden" id="screenResults" aria-label="Science Sorter results">
    <div class="screen-inner center-text">
      <p class="results-emoji" id="resultsEmoji">🎉</p>
      <p class="results-score" id="resultsScore">8 / 10</p>
      <p class="results-detail" id="resultsDetail">Great job! That's 80% correct.</p>
      <div class="results-actions">
        <button type="button" class="btn-secondary" id="changeSettingsBtn">Change Settings</button>
        <button type="button" class="btn-primary-lg" id="playAgainBtn">Play Again</button>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';


  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffle(arr) {
    var copy = arr.slice();
    for (var j = copy.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = copy[j];
      copy[j] = copy[k];
      copy[k] = tmp;
    }
    return copy;
  }

  function uniqueExcept(candidates, correct, n) {
    var out = [];
    candidates.forEach(function (c) {
      if (c !== correct && out.indexOf(c) === -1) { out.push(c); }
    });
    return out.slice(0, n);
  }

  // -------------------------------------------------------------------
  // Sorting decks. Each item: [emoji, name, category, optional fact].
  // "Hard" adds the classic trick items (bat, whale, penguin, fire,
  // mushroom, sand, honey...) with a short explanation after answering.
  // Emoji kept to widely supported ones (Unicode 11 and earlier).
  // -------------------------------------------------------------------
  var CATEGORIES = {
    living: [['living', '🌱 Living'], ['nonliving', '⚙️ Non-living']],
    animals: [['mammal', '🐾 Mammal'], ['bird', '🐦 Bird'], ['fish', '🐟 Fish'], ['reptile', '🦎 Reptile'], ['insect', '🐞 Insect']],
    matter: [['solid', '🧱 Solid'], ['liquid', '💧 Liquid'], ['gas', '💨 Gas']]
  };

  var DECKS = {
    living: {
      easy: [['🐶', 'Dog', 'living'], ['🌳', 'Tree', 'living'], ['🐱', 'Cat', 'living'], ['🌻', 'Sunflower', 'living'], ['🐝', 'Bee', 'living'],
             ['🚗', 'Car', 'nonliving'], ['⚽', 'Ball', 'nonliving'], ['📚', 'Book', 'nonliving'], ['✏️', 'Pencil', 'nonliving'], ['🧸', 'Teddy bear', 'nonliving']],
      medium: [['🐟', 'Fish', 'living'], ['🐛', 'Caterpillar', 'living'], ['🌵', 'Cactus', 'living', 'A cactus grows, needs water and makes seeds — it is a living plant.'], ['🐢', 'Turtle', 'living'],
               ['🎒', 'Backpack', 'nonliving'], ['✂️', 'Scissors', 'nonliving'], ['🔑', 'Key', 'nonliving'], ['📱', 'Phone', 'nonliving'], ['💧', 'Water', 'nonliving', 'Living things need water, but water itself is not alive.']],
      hard: [['🍄', 'Mushroom', 'living', 'Mushrooms are fungi — they grow, feed and make spores, so they are alive.'], ['🌱', 'Seed', 'living', 'A seed is alive but resting. Give it water and warmth and it grows.'],
             ['🦠', 'Germ', 'living', 'Germs are tiny living things. They feed, grow and make more of themselves.'], ['🔥', 'Fire', 'nonliving', 'Fire moves and "grows", but it cannot eat, breathe or have babies — it is not alive.'],
             ['☀️', 'Sun', 'nonliving', 'The Sun gives energy to living things, but it is a star, not a living thing.'], ['🤖', 'Robot', 'nonliving', 'A robot can move, but it cannot grow or reproduce. It is a machine.'],
             ['☁️', 'Cloud', 'nonliving', 'Clouds are made of tiny water drops. They move, but they are not alive.']]
    },
    animals: {
      easy: [['🐶', 'Dog', 'mammal'], ['🐄', 'Cow', 'mammal'], ['🐘', 'Elephant', 'mammal'], ['🦆', 'Duck', 'bird'], ['🦉', 'Owl', 'bird'],
             ['🐠', 'Clownfish', 'fish'], ['🐍', 'Snake', 'reptile'], ['🐊', 'Crocodile', 'reptile'], ['🐝', 'Bee', 'insect'], ['🦋', 'Butterfly', 'insect']],
      medium: [['🦁', 'Lion', 'mammal'], ['🐒', 'Monkey', 'mammal'], ['🦜', 'Parrot', 'bird'], ['🐓', 'Rooster', 'bird'], ['🐡', 'Pufferfish', 'fish'],
               ['🦎', 'Lizard', 'reptile'], ['🐢', 'Turtle', 'reptile', 'Turtles have scaly skin and lay eggs on land — they are reptiles.'], ['🐜', 'Ant', 'insect'], ['🐞', 'Ladybug', 'insect'], ['🦗', 'Cricket', 'insect']],
      hard: [['🐋', 'Whale', 'mammal', 'Whales live in the sea, but they breathe air and feed their babies milk — mammals!'], ['🦇', 'Bat', 'mammal', 'Bats fly, but they have fur and feed their babies milk — mammals!'],
             ['🐬', 'Dolphin', 'mammal', 'Dolphins breathe air through a blowhole and feed their babies milk.'], ['🐧', 'Penguin', 'bird', 'Penguins cannot fly, but they have feathers and lay eggs — birds!'],
             ['🦈', 'Shark', 'fish', 'Sharks breathe through gills and live in water all their lives — fish!'], ['🦖', 'Dinosaur (T. rex)', 'reptile', 'Dinosaurs were reptiles that lived long ago.'],
             ['🦉', 'Owl', 'bird'], ['🐜', 'Ant', 'insect', 'Ants have six legs and three body parts, like every insect.']]
    },
    matter: {
      easy: [['🍎', 'Apple', 'solid'], ['🧱', 'Brick', 'solid'], ['🥄', 'Spoon', 'solid'], ['🔑', 'Key', 'solid'],
             ['💧', 'Water', 'liquid'], ['🥛', 'Milk', 'liquid'], ['☕', 'Tea', 'liquid'], ['💨', 'Air', 'gas'], ['🌬️', 'Wind', 'gas']],
      medium: [['📏', 'Ruler', 'solid'], ['❄️', 'Snow', 'solid', 'Snow is frozen water — a solid that melts into a liquid.'], ['🍹', 'Juice', 'liquid'], ['🛢️', 'Oil', 'liquid'],
               ['♨️', 'Steam', 'gas', 'Steam is water heated until it turns into a gas.'], ['🎈', 'Air inside a balloon', 'gas'], ['🍫', 'Chocolate bar', 'solid']],
      hard: [['⏳', 'Sand', 'solid', 'Sand pours like a liquid, but every grain is a tiny solid that keeps its shape.'], ['🍯', 'Honey', 'liquid', 'Honey is thick and slow, but it flows and takes the shape of its jar — a liquid.'],
             ['🍦', 'Ice cream', 'solid', 'Frozen ice cream is a solid — until it melts into a liquid!'], ['🎈', 'Helium in a balloon', 'gas', 'Helium is a gas that is lighter than air, so the balloon floats.'],
             ['🧼', 'Soap bar', 'solid'], ['🥤', 'Soda', 'liquid', 'Soda is a liquid with bubbles of gas inside it.'], ['🌫️', 'Fog', 'liquid', 'Fog is made of tiny drops of liquid water floating in the air.']]
    }
  };

  // Hard includes the easier items too so the deck never runs dry.
  function deckFor(mode, level) {
    var d = DECKS[mode];
    if (level === 'easy') { return d.easy; }
    if (level === 'medium') { return d.easy.concat(d.medium); }
    return d.medium.concat(d.hard);
  }

  var drawState = {};
  function draw(mode, level) {
    var key = mode + ':' + level;
    if (!drawState[key] || drawState[key].length === 0) { drawState[key] = shuffle(deckFor(mode, level)); }
    return drawState[key].pop();
  }

  function buildSortQuestion(mode, level) {
    var item = draw(mode, level);
    var cats = CATEGORIES[mode];
    var correctCat = cats.filter(function (c) { return c[0] === item[2]; })[0];
    var choices;
    if (cats.length > 4) {
      var others = shuffle(cats.filter(function (c) { return c[0] !== item[2]; })).slice(0, 3);
      choices = shuffle([correctCat].concat(others));
    } else {
      choices = cats.slice();
    }
    var prompts = { living: 'Is it living or non-living?', animals: 'Which animal group does it belong to?', matter: 'Is it a solid, a liquid or a gas?' };
    return {
      type: mode,
      emoji: item[0],
      name: item[1],
      fact: item[3] || '',
      text: prompts[mode],
      correct: correctCat[1],
      choices: choices.map(function (c) { return c[1]; })
    };
  }

  var QUESTION_GENERATORS = {
    living: function (level) { return buildSortQuestion('living', level); },
    animals: function (level) { return buildSortQuestion('animals', level); },
    matter: function (level) { return buildSortQuestion('matter', level); }
  };

  // -------------------------------------------------------------------
  // Sound — tiny WebAudio-generated tones, no audio files, muted state
  // persisted locally. Never plays automatically; only ever triggered by
  // a direct user action (answering, finishing).
  // -------------------------------------------------------------------
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var audioCtx = null;
  var soundOn = true;
  try {
    soundOn = localStorage.getItem('ss_sound_on') !== '0';
  } catch (e) { /* localStorage unavailable — default to on, non-fatal */ }

  function getAudioCtx() {
    if (!AudioCtx) { return null; }
    if (!audioCtx) { audioCtx = new AudioCtx(); }
    return audioCtx;
  }

  function playTone(freq, durationMs, delayMs) {
    if (!soundOn) { return; }
    var ctx = getAudioCtx();
    if (!ctx) { return; }
    var start = ctx.currentTime + (delayMs || 0) / 1000;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + durationMs / 1000);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + durationMs / 1000 + 0.02);
  }

  function soundCorrect() { playTone(660, 120, 0); playTone(880, 160, 110); }
  function soundIncorrect() { playTone(220, 220, 0); }
  function soundStreak() { playTone(660, 100, 0); playTone(784, 100, 90); playTone(988, 180, 180); }
  function soundComplete() { playTone(523, 140, 0); playTone(659, 140, 130); playTone(784, 220, 260); }

  // -------------------------------------------------------------------
  // Play tracking — lets the TeachLuma admin dashboard show real usage
  // counts. Fire-and-forget: a network failure here must never block or
  // break gameplay, so every error is swallowed silently. Uses a relative
  // path (not an absolute URL) so this same file works unmodified no
  // matter what path the site is hosted under.
  // -------------------------------------------------------------------
  function trackPlay(eventType) {
    try {
      fetch('../../../api/game-track.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: 'science-sorter', event: eventType })
      }).catch(function () {});
    } catch (e) { /* non-fatal */ }
  }

  // -------------------------------------------------------------------
  // Fullscreen — feature-detected; hidden entirely on browsers/devices
  // (notably iPhone Safari) with no Fullscreen API support at all.
  // -------------------------------------------------------------------
  var appEl = document.getElementById('app');
  var fullscreenBtn = document.getElementById('fullscreenBtn');

  function requestFs(el) {
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { fn.call(el).catch(function () {}); }
  }
  function exitFs() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn) { fn.call(document); }
  }
  function currentFsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  var fsSupported = !!(appEl.requestFullscreen || appEl.webkitRequestFullscreen);

  if (!fsSupported) {
    fullscreenBtn.classList.add('hidden');
  } else {
    fullscreenBtn.addEventListener('click', function () {
      if (currentFsElement()) {
        exitFs();
      } else {
        requestFs(appEl);
      }
    });
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (evt) {
      document.addEventListener(evt, function () {
        var active = !!currentFsElement();
        fullscreenBtn.textContent = active ? '⤢ Exit Fullscreen' : '⛶ Fullscreen';
        fullscreenBtn.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
      });
    });
  }

  // -------------------------------------------------------------------
  // Mute toggle
  // -------------------------------------------------------------------
  var muteBtn = document.getElementById('muteBtn');
  function renderMuteBtn() {
    muteBtn.textContent = soundOn ? '🔊' : '🔇';
    muteBtn.setAttribute('aria-pressed', soundOn ? 'false' : 'true');
    muteBtn.setAttribute('aria-label', soundOn ? 'Mute sound' : 'Unmute sound');
  }
  renderMuteBtn();
  muteBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    renderMuteBtn();
    try { localStorage.setItem('ss_sound_on', soundOn ? '1' : '0'); } catch (e) { /* non-fatal */ }
  });

  // -------------------------------------------------------------------
  // Screens
  // -------------------------------------------------------------------
  var screenStart = document.getElementById('screenStart');
  var screenPlay = document.getElementById('screenPlay');
  var screenResults = document.getElementById('screenResults');

  function showScreen(el) {
    [screenStart, screenPlay, screenResults].forEach(function (s) {
      s.classList.toggle('hidden', s !== el);
    });
  }

  // -------------------------------------------------------------------
  // Start-screen option groups (mode / difficulty / question count / timer)
  // -------------------------------------------------------------------
  var settings = { mode: 'living', difficulty: 'medium', totalQuestions: 10, timerSeconds: 0 };

  function wireOptionGroup(groupId, settingKey, parse) {
    var group = document.getElementById(groupId);
    var buttons = Array.prototype.slice.call(group.querySelectorAll('.option-btn'));
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        btn.setAttribute('aria-pressed', 'true');
        settings[settingKey] = parse(btn.dataset.value);
      });
    });
  }

  wireOptionGroup('modeGroup', 'mode', function (v) { return v; });
  wireOptionGroup('difficultyGroup', 'difficulty', function (v) { return v; });
  wireOptionGroup('countGroup', 'totalQuestions', function (v) { return parseInt(v, 10); });
  wireOptionGroup('timerGroup', 'timerSeconds', function (v) { return parseInt(v, 10); });

  // -------------------------------------------------------------------
  // Gameplay state
  // -------------------------------------------------------------------
  // Optional fun layer (shared/game-fx.js); the game plays normally without it.
  var FX = window.TLFX || null;
  var teams = FX ? new FX.Teams() : null;
  var teamMode = false;

  var state = {
    index: 0,
    score: 0,
    streak: 0,
    bestStreak: 0,
    questions: [],
    locked: false,
    timerHandle: null,
    timeLeft: 0
  };

  var hudCounter = document.getElementById('hudCounter');
  var hudScore = document.getElementById('hudScore');
  var hudStreak = document.getElementById('hudStreak');
  var hudStreakCount = document.getElementById('hudStreakCount');

  function updateStreakDisplay() {
    if (teams && teams.enabled) { hudStreak.classList.add('hidden'); return; }
    hudStreakCount.textContent = String(state.streak);
    if (state.streak >= 2) {
      hudStreak.classList.remove('hidden');
      hudStreak.classList.remove('pop');
      void hudStreak.offsetWidth;
      hudStreak.classList.add('pop');
    } else {
      hudStreak.classList.add('hidden');
    }
  }
  var progressFill = document.getElementById('progressFill');
  var progressTrack = document.getElementById('progressTrack');
  var timerWrap = document.getElementById('timerWrap');
  var timerFill = document.getElementById('timerFill');
  var timerTrack = document.getElementById('timerTrack');
  var timerLabelText = document.getElementById('timerLabelText');
  var gameDisplay = document.getElementById('gameDisplay');
  var questionText = document.getElementById('questionText');
  var feedbackText = document.getElementById('feedbackText');
  var factText = document.getElementById('factText');
  function showFact(q) { factText.textContent = q.fact ? '💡 ' + q.fact : ''; }
  var answersGrid = document.getElementById('answersGrid');
  var answerButtons = Array.prototype.slice.call(document.querySelectorAll('.answer-btn'));

  function renderDisplay(q) {
    gameDisplay.innerHTML = '<div class="ss-card"><span class="ss-emoji" aria-hidden="true">' + q.emoji + '</span><span class="ss-name">' + q.name + '</span></div>';
  }

  function clearTimer() {
    if (state.timerHandle) {
      window.clearInterval(state.timerHandle);
      state.timerHandle = null;
    }
  }

  function startQuestionTimer() {
    clearTimer();
    if (!settings.timerSeconds) {
      timerWrap.classList.add('hidden');
      return;
    }
    timerWrap.classList.remove('hidden');
    state.timeLeft = settings.timerSeconds;
    timerLabelText.textContent = String(state.timeLeft);
    timerFill.style.width = '100%';
    timerFill.classList.remove('urgent');
    timerTrack.setAttribute('aria-valuenow', '100');

    state.timerHandle = window.setInterval(function () {
      state.timeLeft--;
      var pct = Math.max(0, (state.timeLeft / settings.timerSeconds) * 100);
      timerFill.style.width = pct + '%';
      timerTrack.setAttribute('aria-valuenow', String(Math.round(pct)));
      timerLabelText.textContent = String(Math.max(0, state.timeLeft));
      if (state.timeLeft <= 3) {
        timerFill.classList.add('urgent');
      }
      if (state.timeLeft <= 0) {
        clearTimer();
        handleTimeout();
      }
    }, 1000);
  }

  function renderQuestion() {
    var q = state.questions[state.index];
    questionText.textContent = q.text;
    hudCounter.innerHTML = 'Question <strong>' + (state.index + 1) + '</strong> / ' + settings.totalQuestions;
    if (teams) { teams.renderTurn(document.getElementById('hudTeam'), state.index); }
    if (FX) {
      FX.enter(document.querySelector('.game-display') || questionText);
      FX.enter(document.getElementById('answersGrid'));
    }
    var progressPct = (state.index / settings.totalQuestions) * 100;
    progressFill.style.width = progressPct + '%';
    progressTrack.setAttribute('aria-valuenow', String(Math.round(progressPct)));
    feedbackText.textContent = ' ';
    feedbackText.className = 'feedback';
    factText.textContent = '';
    state.locked = false;

    renderDisplay(q);

    var count = q.choices.length;
    answerButtons.forEach(function (btn, i) {
      if (i < count) {
        btn.className = 'answer-btn';
        btn.textContent = String(q.choices[i]);
        btn.dataset.answer = String(q.choices[i]);
        btn.disabled = false;
      } else {
        btn.className = 'answer-btn hidden';
        btn.disabled = true;
      }
    });
    answersGrid.classList.toggle('answers-compact', count === 2);
    answersGrid.classList.toggle('answers-three', count === 3);

    startQuestionTimer();
  }

  function buildQuestions() {
    var generator = QUESTION_GENERATORS[settings.mode] || QUESTION_GENERATORS['living'];
    var list = [];
    for (var i = 0; i < settings.totalQuestions; i++) {
      list.push(generator(settings.difficulty));
    }
    return list;
  }

  function startGame() {
    state.index = 0;
    state.score = 0;
    state.streak = 0;
    state.bestStreak = 0;
    state.questions = buildQuestions();
    if (teams) { teams.reset(teamMode); }
    hudScore.textContent = teams && teams.enabled ? teams.scoreText() : '0';
    updateStreakDisplay();
    showScreen(screenPlay);
    renderQuestion();
    trackPlay('started');
  }

  function lockButtons() {
    answerButtons.forEach(function (b) { b.disabled = true; });
  }

  function revealCorrect(correct) {
    answerButtons.forEach(function (b) {
      if (b.classList.contains('hidden')) { return; }
      if (b.dataset.answer === String(correct)) {
        b.classList.add('correct');
      } else {
        b.classList.add('dimmed');
      }
    });
  }

  function advance() {
    window.setTimeout(function () {
      state.index++;
      if (state.index < settings.totalQuestions) {
        renderQuestion();
      } else {
        finishGame();
      }
    }, state.questions[state.index] && state.questions[state.index].fact ? 3200 : 1300);
  }

  function handleTimeout() {
    if (state.locked) { return; }
    state.locked = true;
    lockButtons();
    var q = state.questions[state.index];
    revealCorrect(q.correct);
    showFact(q);
    feedbackText.textContent = "⏰ Time's Up!";
    feedbackText.className = 'feedback incorrect';
    soundIncorrect();
    state.streak = 0;
    updateStreakDisplay();
    advance();
  }

  function handleAnswer(btn) {
    if (state.locked) { return; }
    state.locked = true;
    clearTimer();
    lockButtons();

    var q = state.questions[state.index];
    var isCorrect = btn.dataset.answer === String(q.correct);
    showFact(q);

    if (isCorrect) {
      state.score++;
      state.streak++;
      state.bestStreak = Math.max(state.bestStreak, state.streak);
      if (teams && teams.enabled) {
        teams.award(state.index);
        hudScore.textContent = teams.scoreText();
      } else {
        hudScore.textContent = String(state.score);
      }
      btn.classList.add('correct');
      if (FX) { FX.popText(btn, '+1'); }
      updateStreakDisplay();

      if (teams && teams.enabled) {
        feedbackText.textContent = '✓ Point for ' + FX.TEAM_NAMES[teams.turn(state.index)] + '!';
        soundCorrect();
      } else if (state.streak >= 3 && state.streak % 3 === 0) {
        feedbackText.textContent = '🔥 ' + state.streak + ' in a row!';
        soundStreak();
      } else {
        feedbackText.textContent = '✓ Correct!';
        soundCorrect();
      }
      feedbackText.className = 'feedback correct';
    } else {
      btn.classList.add('incorrect');
      if (FX) { FX.shake(btn); }
      answerButtons.forEach(function (b) {
        if (b.classList.contains('hidden') || b === btn) { return; }
        if (b.dataset.answer === String(q.correct)) {
          b.classList.add('correct');
        } else {
          b.classList.add('dimmed');
        }
      });
      feedbackText.textContent = '✗ Try Again!';
      feedbackText.className = 'feedback incorrect';
      soundIncorrect();
      state.streak = 0;
      updateStreakDisplay();
    }

    advance();
  }

  answerButtons.forEach(function (btn) {
    btn.addEventListener('click', function () { handleAnswer(btn); });
  });

  // Keyboard support during gameplay: number keys 1-4 pick an answer
  // (only the currently visible ones respond).
  document.addEventListener('keydown', function (event) {
    if (screenPlay.classList.contains('hidden')) { return; }
    var num = parseInt(event.key, 10);
    if (num >= 1 && num <= 4) {
      var target = answerButtons[num - 1];
      if (target && !target.disabled && !target.classList.contains('hidden')) {
        target.click();
      }
    }
  });

  function finishGame() {
    clearTimer();
    var total = settings.totalQuestions;
    var pct = Math.round((state.score / total) * 100);
    var emoji = pct >= 80 ? '🎉' : (pct >= 50 ? '👍' : '💪');
    var message = pct >= 80
      ? 'Excellent work!'
      : (pct >= 50 ? 'Good effort!' : 'Keep practicing — you\'ll get faster!');

    var streakNote = state.bestStreak >= 3 ? (' Best streak: ' + state.bestStreak + '.') : '';

    var resultsScoreEl = document.getElementById('resultsScore');
    if (teams && teams.enabled) {
      var summary = teams.summary();
      document.getElementById('resultsEmoji').textContent = summary.emoji;
      resultsScoreEl.textContent = summary.title;
      document.getElementById('resultsDetail').textContent = summary.detail;
    } else {
      document.getElementById('resultsEmoji').textContent = emoji;
      resultsScoreEl.textContent = state.score + ' / ' + total;
      document.getElementById('resultsDetail').textContent = message + ' That\'s ' + pct + '% correct.' + streakNote;
    }

    showScreen(screenResults);
    if (FX) {
      if (teams && teams.enabled) {
        FX.celebrate({ after: resultsScoreEl, confetti: true });
      } else {
        FX.celebrate({
          after: resultsScoreEl,
          stars: FX.starCount(pct),
          bestKey: 'fraction-frenzy:' + (settings.mode || settings.step) + ':' + settings.difficulty + ':' + total,
          bestValue: pct,
          bestLabel: function (v) { return v + '%'; },
          confetti: pct >= 60
        });
      }
    }
    soundComplete();
    trackPlay('completed');
  }

  document.getElementById('startBtn').addEventListener('click', function () { teamMode = false; startGame(); });
  var startTeamsBtn = document.getElementById('startTeamsBtn');
  if (teams) {
    startTeamsBtn.addEventListener('click', function () { teamMode = true; startGame(); });
  } else {
    startTeamsBtn.classList.add('hidden');
  }
  document.getElementById('playAgainBtn').addEventListener('click', startGame);
  document.getElementById('changeSettingsBtn').addEventListener('click', function () {
    clearTimer();
    showScreen(screenStart);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !screenResults.classList.contains('hidden')) {
      startGame();
    }
  });
})();
</script>
</body>
</html>

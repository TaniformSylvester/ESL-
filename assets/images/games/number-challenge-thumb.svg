<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Number Challenge">
  <defs>
    <linearGradient id="ncBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="225" fill="url(#ncBg)"/>

  <!-- soft background texture -->
  <circle cx="365" cy="30" r="70" fill="#ffffff" opacity="0.06"/>
  <circle cx="20" cy="200" r="55" fill="#ffffff" opacity="0.06"/>

  <!-- floating operator accents -->
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" opacity="0.35">+</text>
  <text x="325" y="185" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" opacity="0.35">&#8722;</text>

  <!-- back flash card -->
  <g transform="translate(148,120) rotate(-9)">
    <rect x="-70" y="-42" width="140" height="84" rx="14" fill="#f8fafc"/>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1e3a8a" text-anchor="middle">8 + 5</text>
  </g>

  <!-- front answer card -->
  <g transform="translate(266,132) rotate(7)">
    <rect x="-56" y="-40" width="112" height="80" rx="14" fill="#ffffff"/>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#2563eb" text-anchor="middle">13</text>
  </g>

  <!-- correct checkmark badge -->
  <g transform="translate(316,96)">
    <circle r="20" fill="#16a34a"/>
    <path d="M -9 0 L -3 7 L 10 -8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lightning accent -->
  <g transform="translate(56,150)">
    <polygon points="10,-22 -8,2 3,2 -6,24 16,-4 4,-4" fill="#f59e0b"/>
  </g>
</svg>

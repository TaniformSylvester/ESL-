<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Fraction Frenzy">
  <defs>
    <linearGradient id="ffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="225" fill="url(#ffBg)"/>

  <!-- soft background texture -->
  <circle cx="360" cy="35" r="60" fill="#ffffff" opacity="0.06"/>
  <circle cx="30" cy="190" r="55" fill="#ffffff" opacity="0.06"/>

  <!-- fraction bar 1/2 -->
  <g transform="translate(90,80)">
    <rect x="-70" y="-20" width="140" height="40" rx="8" fill="#ffffff" stroke="#5b21b6" stroke-width="3"/>
    <rect x="-70" y="-20" width="70" height="40" rx="8" fill="#f59e0b"/>
    <rect x="0" y="-20" width="0" height="40" fill="none"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#5b21b6" stroke-width="3"/>
    <text x="0" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">1/2</text>
  </g>

  <!-- fraction bar 2/4 (equivalent) -->
  <g transform="translate(300,80)">
    <rect x="-70" y="-20" width="140" height="40" rx="8" fill="#ffffff" stroke="#5b21b6" stroke-width="3"/>
    <rect x="-70" y="-20" width="35" height="40" fill="#f59e0b"/>
    <rect x="-35" y="-20" width="35" height="40" fill="#f59e0b"/>
    <line x1="-35" y1="-20" x2="-35" y2="20" stroke="#5b21b6" stroke-width="2"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#5b21b6" stroke-width="3"/>
    <line x1="35" y1="-20" x2="35" y2="20" stroke="#5b21b6" stroke-width="2"/>
    <text x="0" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">2/4</text>
  </g>

  <!-- equals sign -->
  <text x="200" y="90" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">=</text>

  <!-- correct checkmark badge -->
  <g transform="translate(200,165)">
    <circle r="22" fill="#16a34a"/>
    <path d="M -10 0 L -3 8 L 11 -9" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

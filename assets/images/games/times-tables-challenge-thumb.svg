<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Times Tables Challenge">
  <defs>
    <linearGradient id="ttcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="225" fill="url(#ttcBg)"/>

  <!-- soft background texture -->
  <circle cx="360" cy="30" r="65" fill="#ffffff" opacity="0.06"/>
  <circle cx="25" cy="195" r="55" fill="#ffffff" opacity="0.06"/>

  <!-- floating operator accents -->
  <text x="55" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff" opacity="0.35">&#215;</text>
  <text x="330" y="185" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff" opacity="0.35">&#247;</text>

  <!-- back flash card -->
  <g transform="translate(148,120) rotate(-9)">
    <rect x="-72" y="-42" width="144" height="84" rx="14" fill="#f8fafc"/>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#5b21b6" text-anchor="middle">6 &#215; 7</text>
  </g>

  <!-- front answer card -->
  <g transform="translate(266,132) rotate(7)">
    <rect x="-56" y="-40" width="112" height="80" rx="14" fill="#ffffff"/>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#7c3aed" text-anchor="middle">42</text>
  </g>

  <!-- correct checkmark badge -->
  <g transform="translate(316,96)">
    <circle r="20" fill="#16a34a"/>
    <path d="M -9 0 L -3 7 L 10 -8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lightning accent -->
  <g transform="translate(56,150)">
    <polygon points="10,-22 -8,2 3,2 -6,24 16,-4 4,-4" fill="#f59e0b"/>
  </g>
</svg>
